apiVersion: apps/v1
kind: Deployment
metadata:
  name: a3-status-demo
  namespace: a3-gitops-demo
  labels:
    app.kubernetes.io/name: a3-status-demo
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: a3-status-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: a3-status-demo
    spec:
      serviceAccountName: a3-demo-workload
      containers:
        - name: web
          image: registry.access.redhat.com/ubi9/python-311:latest
          command: ["python3", "/app/config/server.py"]
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /livez
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3
          volumeMounts:
            - name: config-vol
              mountPath: /app/config
            - name: data-vol
              mountPath: /app/data
      volumes:
        - name: config-vol
          configMap:
            name: a3-status-demo-config
            items:
              - key: server.py
                path: server.py
        - name: data-vol
          configMap:
            name: a3-status-demo-config
            items:
              - key: app-version.json
                path: app-version.json
